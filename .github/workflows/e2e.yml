name: E2E

# The Playwright test suite for this app doesn't live here — it lives in a
# separate repo (saucedemo-playwright, aka "productstore") as a Docker/
# cross-repo practice setup. This workflow checks out both repos side by
# side and runs the same `docker compose` command used locally, so every
# PR here gets tested against that suite without duplicating it.
on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rabbit-hole (this PR)
        uses: actions/checkout@v4

      - name: Checkout productstore (test suite)
        uses: actions/checkout@v4
        with:
          repository: arthurbohan/saucedemo-playwright
          ref: develop
          path: ../productstore

      - name: Run E2E suite against this PR
        working-directory: ../productstore
        env:
          # Sibling checkout is named "rabbit-hole" (this repo's GitHub
          # name) here, not "rabbit hole" (this machine's local directory
          # name) — see the matching override note in
          # productstore/rabbit-hole-e2e/docker-compose.yml.
          RABBIT_HOLE_CONTEXT: ../../rabbit-hole
        run: docker compose -f rabbit-hole-e2e/docker-compose.yml up --build --abort-on-container-exit --exit-code-from tests
